server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2

        - id: problem-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/problems/**
          filters:
            - StripPrefix=2

        - id: contest-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/contests/**
          filters:
            - StripPrefix=2

        - id: submission-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/submissions/**
          filters:
            - StripPrefix=2

        - id: leaderboard-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/leaderboard/**
          filters:
            - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info
