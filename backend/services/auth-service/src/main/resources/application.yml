server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:codeforge_auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET:QWxsIHRoZSB3b3JsZCBpcyBub3QgYW55bW9yZSB0aGFuIGEgZ29vZCBzZWNyZXQ=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@university.edu}
    password: ${ADMIN_PASSWORD:Admin123!}
